name: Android APK build

on:
  workflow_dispatch:
  push:
    branches:
      - claude/android-calendar-app-7980P
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || { echo "Android SDK manager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Build installable test APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
