name: RuStore signed release APK

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Verify signing secrets and install Android SDK
        env:
          STORE_BASE64: ${{ secrets.CALENDAR_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.CALENDAR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CALENDAR_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CALENDAR_KEY_PASSWORD }}
        run: |
          if [[ -z "$STORE_BASE64" || -z "$STORE_PASS" || -z "$KEY_ALIAS" || -z "$KEY_PASS" ]]; then
            echo "::error::Add all four CALENDAR signing secrets in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Restore private signing key
        env:
          STORE_BASE64: ${{ secrets.CALENDAR_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/calendar-release.jks"
          test -s "$RUNNER_TEMP/calendar-release.jks"
      - name: Build signed release APK
        env:
          CALENDAR_SIGNING_STORE_PASSWORD: ${{ secrets.CALENDAR_STORE_PASSWORD }}
          CALENDAR_SIGNING_KEY_ALIAS: ${{ secrets.CALENDAR_KEY_ALIAS }}
          CALENDAR_SIGNING_KEY_PASSWORD: ${{ secrets.CALENDAR_KEY_PASSWORD }}
        run: |
          export CALENDAR_SIGNING_STORE_FILE="$RUNNER_TEMP/calendar-release.jks"
          gradle :app:assembleRelease --no-daemon
      - name: Validate APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/calendar-rustore-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-rustore-signed-apk
          path: dist/calendar-rustore-v1.0.apk
          if-no-files-found: error
          retention-days: 7
